[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reg-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over US bank regulatory texts, with an evaluation harness and a validation report."
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
models = [
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "peft>=0.12",
  "torch>=2.3",
  "scikit-learn>=1.4",
  "pymupdf>=1.24",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
